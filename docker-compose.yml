services:
  db:
    image: mysql:8.4
    profiles: [ "local-db" ]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studybuddy}
      MYSQL_USER: ${MYSQL_USER:-studybuddy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studybuddy_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-studybuddy_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in .env before starting}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://studybuddy:studybuddy_dev_password@db:3306/studybuddy}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTO_CREATE_TABLES: "0"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  nginx:
    image: nginx:1.27-alpine
    profiles: [ "proxy" ]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:

